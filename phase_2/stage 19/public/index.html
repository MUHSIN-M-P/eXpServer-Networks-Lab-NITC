<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Welcome</title>
		<style>
			:root {
				color-scheme: dark;
				font-family:
					Inter,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					sans-serif;
			}

			* {
				box-sizing: border-box;
			}

			body {
				min-height: 100vh;
				margin: 0;
				display: grid;
				place-items: center;
				padding: 2rem;
				color: #e2e8f0;
				background: linear-gradient(135deg, #0f172a, #1e293b);
			}

			main {
				width: min(100%, 42rem);
				padding: clamp(2rem, 8vw, 5rem);
				text-align: center;
				border: 1px solid rgba(148, 163, 184, 0.25);
				border-radius: 1.5rem;
				background: rgba(15, 23, 42, 0.72);
				box-shadow: 0 1.5rem 4rem rgba(2, 6, 23, 0.35);
				backdrop-filter: blur(0.75rem);
			}

			h1 {
				margin: 0;
				font-size: clamp(2rem, 6vw, 3.5rem);
				line-height: 1.1;
				letter-spacing: -0.04em;
				color: #f8fafc;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Contents of public/index.html</h1>
		</main>
	</body>
</html>
